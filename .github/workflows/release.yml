name: Release workflow

on:
  push:
    branches: [master, alpha, beta]
  pull_request:
    branches: [master, alpha, beta]

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release_tag.outputs.release_tag }}

    permissions:
      contents: write # to be able to publish a GitHub release
      issues: write # to be able to comment on released issues
      pull-requests: write # to be able to comment on released pull requests
      id-token: write # to enable use of OIDC for npm provenance

    steps:
      - name: Checkout to the repository 🛎️
        uses: actions/checkout@v6

      - name: Setup and Build
        uses: ./.github/actions/setup-and-build

      - name: Start Semantic Release
        if: ${{ github.event_name == 'push' }}
        run: HUSKY=0 npx semantic-release # disable git hooks for @semantic-release/git plugin commits
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve release tag
        if: ${{ github.event_name == 'push' && github.ref_name == 'master' }}
        id: release_tag
        shell: bash
        run: |
          git fetch origin master --tags
          version="$(git show origin/master:package.json | node -p "JSON.parse(require('node:fs').readFileSync(0, 'utf8')).version")"
          echo "release_tag=v$version" >> "$GITHUB_OUTPUT"

  deploy:
    needs: release
    if: ${{ github.event_name == 'push' && github.ref_name == 'master' && needs.release.outputs.release_tag != '' }}
    uses: ./.github/workflows/deploy.yml
    with:
      release_tag: ${{ needs.release.outputs.release_tag }}
    secrets:
      sentry_auth_token: ${{ secrets.SENTRY_AUTH_TOKEN }}
